name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout reusable ECH proxy
        uses: actions/checkout@v4
        with:
          repository: anglesgirl/ech-proxy-go
          path: ech-proxy-go

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build gomobile ECH AAR (arm64)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p app/libs
          cd ech-proxy-go
          gomobile bind -v -target=android/arm64 -androidapi 27 \
            -o ../app/libs/echproxy.aar ./mobile/echproxy

      - name: Provide CI-only Google Services config
        run: |
          cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"000000000000","project_id":"han1meviewer-ech-ci","storage_bucket":"han1meviewer-ech-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.yenaly.han1meviewer.debug"}},"api_key":[{"current_key":"ci-placeholder-not-a-secret"}]}],"configuration_version":"1"}
          EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lint
        env:
          HA_GITHUB_TOKEN: ''
          HA1_VERSION_SOURCE: ci

      - name: Verify ECH JNI library in APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Han1meViewer-ECH-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
