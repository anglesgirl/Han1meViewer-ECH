name: Manual Release with Custom Tag

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag name (e.g., v1.0.1-release+2608061200)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate tag format (optional)
        run: |
          if [[ ! "${{ github.event.inputs.version_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-release\+[0-9]+$ ]]; then
            echo "⚠️ Tag should look like v1.0.2-release+2608061200"
            echo "Continuing anyway..."
          fi

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout reusable ECH proxy
        uses: actions/checkout@v5
        with:
          repository: anglesgirl/ech-proxy-go
          path: ech-proxy-go

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build gomobile ECH AAR (arm64)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p app/libs
          cd ech-proxy-go
          gomobile bind -v -target=android/arm64 -androidapi 27 \
            -o ../app/libs/echproxy.aar ./mobile/echproxy

      - name: Decode signing keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/keystore.jks"
          chmod 600 "$HOME/.android/keystore.jks"
          ls -la "$HOME/.android/keystore.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build release APK (signed)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint
        env:
          HA_GITHUB_TOKEN: ''
          HA1_VERSION_SOURCE: release
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Verify signature and ECH JNI library
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni.so'
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Create tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ github.event.inputs.version_tag }}"
          git push origin -f "${{ github.event.inputs.version_tag }}"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
